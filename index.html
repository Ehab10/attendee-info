<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤتمر "ونحن في الحق في ابنه" | صيف ٢٠٢٦</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="icon" href="https://placehold.co/32x32/3B82F6/FFFFFF?text=✝️" type="image/png">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .font-verse {
            font-family: 'Amiri', 'Cairo', serif;
        }
        .title-gradient {
            background: linear-gradient(120deg, #ffffff 10%, #bae6fd 50%, #fde68a 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .glass {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes drift {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }
        .rise { opacity: 0; animation: rise 0.9s ease-out forwards; }
        .drift { animation: drift 24s ease-in-out infinite alternate; }
        @media (prefers-reduced-motion: reduce) {
            .rise { opacity: 1; animation: none; }
            .drift { animation: none; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">


    <main>
        <section class="relative min-h-screen overflow-hidden flex items-center justify-center text-white">
            <div class="drift absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.pexels.com/photos/53594/blue-clouds-day-fluffy-53594.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-slate-900/70 via-slate-900/40 to-slate-900/80"></div>

            <div class="relative z-10 w-full max-w-4xl mx-auto px-6 py-16 text-center">
                <span class="rise inline-block glass rounded-full px-5 py-1.5 text-sm md:text-base font-semibold tracking-wide" style="animation-delay: 0.1s;">مؤتمر صيف ٢٠٢٦</span>

                <h1 class="rise title-gradient mt-8 text-5xl md:text-7xl lg:text-8xl font-black leading-tight" style="animation-delay: 0.3s;">ونحن في الحق<br>في ابنه</h1>

                <div class="rise mx-auto mt-8 h-1 w-24 rounded-full bg-gradient-to-l from-amber-300 to-sky-300" style="animation-delay: 0.5s;"></div>

                <figure class="rise glass mt-10 rounded-3xl p-6 md:p-10" style="animation-delay: 0.7s;">
                    <blockquote class="font-verse text-xl md:text-3xl leading-loose md:leading-[2.2]">
                        ونَعلَمُ أنَّ ابنَ اللهِ قد جاءَ وأعطانا بَصيرَةً لنَعرِفَ الحَقَّ. ونَحنُ في الحَقِّ في ابنِهِ يَسوعَ المَسيحِ. هذا هو الإلهُ الحَقُّ والحياةُ الأبديَّةُ.
                    </blockquote>
                    <figcaption class="mt-6 inline-block rounded-full bg-white/15 px-4 py-1 text-sm md:text-base font-semibold text-amber-200">يوحنا الأولى ٥: ٢٠</figcaption>
                </figure>
            </div>
        </section>
